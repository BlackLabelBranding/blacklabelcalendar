<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Black Label Branding Calendar</title>
    <link rel="icon" type="image/png" href="https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/blb%20favicon%20(3).png" />
    <link rel="apple-touch-icon" href="https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/blb%20favicon%20(3).png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;850;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .calendar-topbar {
        display: grid;
        grid-template-columns: 1fr;
        place-items: center;
        padding-top: max(30px, env(safe-area-inset-top));
        padding-bottom: 18px;
      }

      .calendar-topbar::before {
        content: "";
        width: min(100%, 760px);
        height: 2px;
        margin-bottom: 20px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(245, 197, 66, 0.35), #f5c542, rgba(245, 197, 66, 0.35), transparent);
        box-shadow: 0 0 28px rgba(245, 197, 66, 0.22);
      }

      .brand-mark {
        justify-content: center;
        width: 100%;
      }

      .brand-mark img {
        width: min(62vw, 420px);
        max-height: 128px;
        object-position: center;
        filter: drop-shadow(0 16px 26px rgba(0, 0, 0, 0.45));
      }

      .top-actions {
        position: absolute;
        top: max(22px, env(safe-area-inset-top));
        right: 14px;
      }

      @media (max-width: 620px) {
        .calendar-topbar {
          padding-top: max(24px, env(safe-area-inset-top));
        }

        .calendar-topbar::before {
          width: min(100%, 520px);
          margin-bottom: 16px;
        }

        .brand-mark img {
          width: min(58vw, 270px);
          max-height: 92px;
        }

        .top-actions {
          top: max(18px, env(safe-area-inset-top));
          right: 12px;
        }

        .icon-button,
        .calendar-link {
          min-width: 46px;
          height: 46px;
        }
      }
    </style>
  </head>
  <body>
    <main class="calendar-shell" aria-live="polite">
      <header class="calendar-topbar">
        <div class="brand-mark" aria-label="Black Label Entertainment">
          <img src="https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/BLE%20Logo.png" alt="Black Label Entertainment" />
          <h1 id="calendarTitle" class="sr-only">Calendar</h1>
        </div>
        <div class="top-actions">
          <a class="calendar-link" id="googleCalendarLink" href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">Open</a>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh calendar">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <section class="now-strip" aria-label="Current date and next event">
        <div class="today-block">
          <span id="todayWeekday">Today</span>
          <strong id="todayDate">--</strong>
        </div>
        <div class="next-block">
          <span>Next up</span>
          <strong id="nextEventTitle">Loading calendar</strong>
          <small id="nextEventTime">One moment</small>
        </div>
      </section>

      <section class="status-banner" id="statusBanner" hidden></section>

      <section id="agendaView" class="agenda-view"></section>
      <section id="todayView" class="agenda-view" hidden></section>
      <section id="weekView" class="week-view" hidden></section>
      <section id="monthView" class="month-view" hidden></section>
    </main>

    <nav class="view-tabs" aria-label="Calendar view">
      <button class="active" type="button" data-view="agenda">Upcoming</button>
      <button type="button" data-view="today">Day</button>
      <button type="button" data-view="week">Week</button>
      <button type="button" data-view="month">Month</button>
    </nav>

    <script type="module" src="./calendar.js"></script>
  </body>
</html>
