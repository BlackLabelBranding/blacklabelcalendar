<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05070a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Black Label Entertainment Calendar</title>
    <link rel="icon" type="image/png" href="https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/blb%20favicon%20(3).png" />
    <link rel="apple-touch-icon" href="https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/blb%20favicon%20(3).png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;650;750;850;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./mobile-polish.css" />
    <link rel="stylesheet" href="./mobile-finish.css" />
  </head>
  <body>
    <main class="calendar-shell" aria-live="polite">
      <header class="calendar-topbar">
        <div class="brand-mark" aria-label="Black Label Entertainment">
          <img src="https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/roughpng.png" alt="Black Label Entertainment" onerror="this.onerror=null; this.src='https://xopcttkrmjvwdddawdaa.supabase.co/storage/v1/object/public/Logos/BLE%20Logo.png';" />
          <h1 id="calendarTitle" class="sr-only">Calendar</h1>
        </div>
        <div class="top-actions">
          <a class="calendar-link" id="googleCalendarLink" href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">Open</a>
          <button class="icon-button" id="refreshButton" type="button" aria-label="Refresh calendar">
            <span aria-hidden="true">↻</span>
          </button>
        </div>
      </header>

      <section class="now-strip" aria-label="Next event">
        <article class="next-block" id="nextEventCard" data-tone="event" data-urgency="normal">
          <div class="next-event-copy">
            <span class="next-event-kicker" id="nextEventKicker">Happening next</span>
            <strong class="next-event-title" id="nextEventTitle">Loading calendar</strong>

            <div class="hero-countdown" id="heroCountdown" aria-label="Time until event">
              <div class="countdown-unit">
                <strong id="heroCountPrimary">--</strong>
                <span id="heroCountPrimaryLabel">Days</span>
              </div>
              <div class="countdown-unit" id="heroCountSecondaryUnit">
                <strong id="heroCountSecondary">--</strong>
                <span id="heroCountSecondaryLabel">Hours</span>
              </div>
            </div>

            <div class="hero-footer">
              <small id="nextEventTime">One moment</small>
              <a class="next-event-link" id="nextEventLink" href="https://calendar.google.com/" target="_blank" rel="noopener noreferrer">
                View Details <span aria-hidden="true">→</span>
              </a>
            </div>
          </div>
        </article>
      </section>

      <section class="status-banner" id="statusBanner" hidden></section>

      <section id="agendaView" class="agenda-view"></section>
      <section id="todayView" class="agenda-view" hidden></section>
      <section id="weekView" class="week-view" hidden></section>
      <section id="monthView" class="month-view" hidden></section>
    </main>

    <nav class="view-tabs" aria-label="Calendar view">
      <button class="active" type="button" data-view="agenda" aria-label="Upcoming events">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/><path d="M8 13h3v3H8z"/></svg>
        <span>Upcoming</span>
      </button>
      <button type="button" data-view="today" aria-label="Day view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4"/><path d="M8 13h3M13 13h3M8 17h3M13 17h3"/></svg>
        <span>Day</span>
      </button>
      <button type="button" data-view="week" aria-label="Week view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6h13M7 12h13M7 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
        <span>Week</span>
      </button>
      <button type="button" data-view="month" aria-label="Month view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v15H4zM4 9h16M8 3v4M16 3v4"/></svg>
        <span>Month</span>
      </button>
    </nav>

    <script type="module" src="./calendar.js"></script>
  </body>
</html>
